---
layout: default
---

<main class="page">

    <p class="section-kicker">
        05 / Blog
    </p>

    <h1>
        {{ page.title }}
    </h1>

    <p class="page-meta">
        {{ page.date | date: "%d.%m.%Y" }}
    </p>

    <div class="page-content">
        {{ content }}
    </div>

    <a
        class="back"
        href="{{ '/#blog' | relative_url }}"
    >
        ← Back to blog
    </a>

</main>
